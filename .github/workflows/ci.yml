name: Frontend CI

on:
  push:
    branches:
      - frontend-k8s
permissions:
  contents: read
  packages: write

jobs:
  test-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/abdelrahman679/t4-frontend:${{ github.run_number }} .
        working-directory: frontend

      - name: Push Docker image
        run: docker push ghcr.io/abdelrahman679/t4-frontend:${{ github.run_number }}

      - name: Clone GitOps repository
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/abdelrahman679/k8s-t4.git


      - name: Update frontend image
        run: |
          sed -i "s|image: ghcr.io/abdelrahman679/t4-frontend:.*|image: ghcr.io/abdelrahman679/t4-frontend:${{ github.run_number }}|" \
            k8s-t4/task4-app/frontend/rollout.yaml
      
      - name: Verify image update
        run: |
          grep "image:" k8s-t4/task4-app/frontend/rollout.yaml

      - name: Commit and push GitOps change
        run: |
          cd k8s-t4

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add task4-app/frontend/rollout.yaml
          git commit -m "Update frontend image to ${{ github.run_number }}"
          git push
