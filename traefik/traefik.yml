api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
     redirections:
       entryPoint:
         to: websecure
         scheme: https

  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false

certificatesResolvers:
  letsencrypt:
    acme:
      email: ${LETSENCRYPT_EMAIL}
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

tls:
  certificates:
    - certFile: /certs/localhost.crt
      keyFile: /certs/localhost.key

log:
  level: INFO
